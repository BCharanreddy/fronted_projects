<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calci.css">
    <script defer src="calci.js"></script>
</head>
<body id="body">
    <div class="box" id="box">
    <div class="display"><h1 id="display"></h1></div>
    <div class="cont">
        
        <div class="number" onclick="reset()"><h1>AC</h1></div>
        <div class="number"><h1><sup>+</sup>/-</h1></div>
        <div class="number" onclick="key(13)"><h1>%</h1></div>
        <div class="number" onclick="key(14)"><h1>/</h1></div>  
        <div class="number" onclick="key(1)"><h1>1</h1></div>
        <div class="number" onclick="key(2)"><h1>2</h1></div>
        <div class="number" onclick="key(3)"><h1>3</h1></div>
        <div class="number" onclick="key(10)"><h1>+</h1></div>
        <div class="number" onclick="key(4)"><h1>4</h1></div>
        <div class="number" onclick="key(5)"><h1>5</h1></div>
        <div class="number" onclick="key(6)"><h1>6</h1></div>
        <div class="number" onclick="key(11)"><h1>-</h1></div>
        <div class="number" onclick="key(7)"><h1>7</h1></div>
        <div class="number" onclick="key(8)"><h1>8</h1></div>
        <div class="number" onclick="key(9)"><h1>9</h1></div>
        <div class="number" onclick="key(12)"><h1>x</h1></div>
        <div class="number" onclick="key(0)"><h1>0</h1></div>
        <div class="number" onclick="key(-1)"><h1>00</h1></div>
        <div class="number"><h1>.</h1></div>
        <div class="number" onclick="fun()"><h1>=</h1></div>
    </div>
    </div>
    <div onclick="toggl()" style="cursor: pointer;background-color: yellow;">Dark/Light Mode</div>
</body>
</html>
