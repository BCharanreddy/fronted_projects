<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="game.css">
    <script defer src="game.js"></script>
    <title>Rock_Paper_Scissor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Rock-Paper-Scissor</h1>
    <div class="head"><h3>Choose any one option to play game</h3></div>
    <div class="rps">
        <!--<p onclick="rps()">Clik here to play Rock-Paper-Scissor</p>-->
        
        <div class="choice" onclick="rps('ROCK')"><h2>ROCK</h2></div>
        <div class="choice" onclick="rps('PAPER')"><h2>PAPER</h2></div>
        <div class="choice" onclick="rps('SCISSOR')"><h2>SCISSOR</h2></div>
        
    </div>
    <div class="result">
        <h3 id="rps_print"></h3>
        <h4 id="rps_end">THE GAME IS OVER</h4>
    </div>
</body>
</html>
